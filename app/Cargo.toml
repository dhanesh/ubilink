# Satisfies: R3 (GPUI Phase 0 plan, task 3). A SEPARATE crate from both
# ubilink-core AND the app shell, on purpose: D8/D11 already established that
# ubilink-core stays GUI-free so its S2 `no_network_deps` guard stays
# physically true, and that the imperative shell is a thin wrapper over
# plain-Rust command logic. This crate IS that command logic, lifted out of the
# Tauri shell (desktop/src/main.rs, deleted in D24) so the GPUI port called the
# same functions instead of re-deriving Tauri's behaviour — a UI port, not a
# logic port. desktop-gpui/ is now its only caller.
#
# Deliberately depends on NOTHING but ubilink-core + serde/serde_json — the
# exact set the moved command bodies already used. No tauri*, no gpui*, no
# wry/tao/webkit*: scripts/probe.py deps-clean enforces this on every CI run,
# the same "physically true, not just documented" pattern as core's
# no_network_deps guard.
[package]
name = "ubilink-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GUI-free command logic for ubilink, called by the GPUI app (R3)."

[lib]
name = "ubilink_app"
path = "src/lib.rs"

[dependencies]
ubilink-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
