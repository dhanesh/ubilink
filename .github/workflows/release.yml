# Release pipeline (spec §4; runbook: docs/RUNBOOK-release.md).
#   verify ─┬─ build-app ─────────┬─ draft-release   (tags only)
#           └─ sign-integrations ─┘
# - A tag must equal the app version (desktop/Cargo.toml): vX.Y.Z or vX.Y.Z-rc.N.
# - build-app is notarized when all six APPLE_* secrets exist in the `release`
#   environment; an rc tag or a manual run may produce an UNNOTARIZED dry-run DMG; a
#   final tag without credentials FAILS (scripts/release-mode.sh).
# - The release is only ever a DRAFT; a maintainer publishes it after the RC checklist.
# - Least privilege: everything is `contents: read` except draft-release. Every
#   `uses:` is pinned to a commit SHA (same pins as ci.yml). No build cache in the
#   signing jobs, so a poisoned cache can't reach a signer.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Rust + rustfmt + clippy
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      # Same guard as ci.yml: `make verify` now builds desktop-gpui/, which needs
      # full Xcode (not just Command Line Tools) for its Metal shaders.
      - name: Confirm full Xcode is selected (needed for GPUI's Metal shaders)
        run: xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: App version
        id: version
        run: echo "version=$(bash scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/release-mode.sh --check-tag "$GITHUB_REF" "${{ steps.version.outputs.version }}"

      - name: make verify
        run: make verify LOCKED=--locked

  build-app:
    needs: verify
    environment: release
    runs-on: macos-latest
    # Cold (uncached) builds for two architectures, plus notarization waits.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Rust + both macOS targets
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: "1.98.1"
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Mode from scripts/release-mode.sh: release (all six secrets) | dry-run (rc tag
      # or manual run) | fail (final tag without secrets). The secrets are exposed to
      # this step only.
      - name: Package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: make dist

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubilink-dmg
          path: desktop/target/bundle/*.dmg
          if-no-files-found: error

  sign-integrations:
    needs: verify
    environment: release
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: "1.98.1"

      - name: Build signer
        run: cargo build --locked --release --bin ubilink-sign

      - name: Sign the release integration bundle
        env:
          UBILINK_SIGNING_KEY: ${{ secrets.UBILINK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ./target/release/ubilink-sign sign \
            --manifest ../plugins/examples/benign/manifest.json \
            --source   ../plugins/examples/benign/plugin.mjs \
            --version  "${GITHUB_RUN_NUMBER}" \
            > dist/benign.signed.json
          echo "Signed by pubkey: $(./target/release/ubilink-sign pubkey)"

      - name: Self-verify the signed bundle
        env:
          UBILINK_SIGNING_KEY: ${{ secrets.UBILINK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          UBILINK_TRUSTED_KEYS="$(./target/release/ubilink-sign pubkey)" \
            ./target/release/ubilink-sign verify --bundle dist/benign.signed.json

      - name: Upload signed bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-bundles
          path: src-tauri/dist/*.signed.json
          if-no-files-found: error

  draft-release:
    needs: [verify, build-app, sign-integrations]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      actions: read # gh run download (this run's artifacts)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Collect artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          mkdir -p out
          find artifacts -type f \( -name '*.dmg' -o -name '*.signed.json' \) -exec cp {} out/ \;
          (cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Release notes
        run: |
          set -euo pipefail
          bash scripts/changelog-section.sh "${{ needs.verify.outputs.version }}" > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Install:** download the `.dmg`, check it with `shasum -a 256 -c SHA256SUMS`,
          open it and drag Ubilink to Applications. A `-UNNOTARIZED` DMG is a pre-release
          dry run: macOS will warn before opening it.
          NOTES

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft "${pre[@]}" \
            --title "Ubilink $GITHUB_REF_NAME" --notes-file notes.md out/*
