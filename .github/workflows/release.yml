# Satisfies: O3 (CI signed builds). On a release tag, this pipeline builds + tests
# the core, then SIGNS each release integration bundle with the org's ed25519
# signing key (a CI secret, never a dev laptop) and SELF-VERIFIES the artifact
# before uploading it. The signing/verify logic is `hooky_core::release`, proven by
# unit tests in src/release.rs; this workflow is the operational wiring O3 needs.
# Setup (one-time) is in docs/RUNBOOK-ci-signing.md.
name: release-signed-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  signed-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test (includes the S2 zero-egress dep guard)
        run: cargo test --locked

      - name: Build signer
        run: cargo build --locked --release --bin hooky-sign

      - name: Sign the release bundle
        env:
          # 64-hex ed25519 signing key. Generate once with `openssl rand -hex 32`
          # and store as a repo/org secret — see docs/RUNBOOK-ci-signing.md.
          HOOKY_SIGNING_KEY: ${{ secrets.HOOKY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ./target/release/hooky-sign sign \
            --manifest ../plugins/examples/benign/manifest.json \
            --source   ../plugins/examples/benign/plugin.mjs \
            --version  "${GITHUB_RUN_NUMBER}" \
            > dist/benign.signed.json
          echo "Signed by pubkey: $(./target/release/hooky-sign pubkey)"

      - name: Self-verify the signed artifact (fail the build if it doesn't validate)
        env:
          HOOKY_SIGNING_KEY: ${{ secrets.HOOKY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # Trust exactly the key we just signed with; a real consumer would pin the
          # published release pubkey here instead.
          HOOKY_TRUSTED_KEYS="$(./target/release/hooky-sign pubkey)" \
            ./target/release/hooky-sign verify --bundle dist/benign.signed.json

      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-bundles
          path: src-tauri/dist/*.signed.json
          if-no-files-found: error
