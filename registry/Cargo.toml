# Satisfies: O4 (plugin/integration registry service). A SEPARATE crate from
# ubilink-core on purpose: a registry is a network service, and S2 forbids the CORE
# from egress — not a standalone service. Keeping it out of ubilink-core means the
# core's `no_network_deps` guard stays physically true.
#
# Dependencies are deliberately minimal: ubilink-core (reuse the proven ed25519
# sign/verify + WireBundle wire format) and serde_json. The HTTP layer is std-only
# (no axum/hyper/warp) — zero added supply-chain surface, matching the project ethos.
[package]
name = "ubilink-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Signed-integration registry service for ubilink (O4). std-only HTTP, reuses ubilink-core's ed25519 trust model."

[lib]
name = "ubilink_registry"
path = "src/lib.rs"

[[bin]]
name = "ubilink-registry"
path = "src/bin/ubilink-registry.rs"

[dependencies]
ubilink-core = { path = "../src-tauri" }
serde_json = "1"
