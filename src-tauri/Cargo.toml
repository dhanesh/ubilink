# Satisfies: RT-5 (binding), RT-6, S1 (invariant), T1 (boundary), TN1 (capability broker).
# See .manifold/linking-manifesto-app.md
#
# Minimal crate for the plugin-sandbox spike (manifold evidence E8/E9).
# Deliberately depends on no GUI stack (the directory name is from the Tauri era;
# the app is now native GPUI, D22/D24): the capability broker is plain Rust and is
# unit/integration-testable without a windowing/runtime stack. The app reaches it
# through the GUI-free ubilink-app crate (app/).
# Dep tree kept tiny (serde + serde_json only) so `cargo test` builds fast.
[package]
name = "ubilink-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Capability broker + separate-process plugin sandbox spike for ubilink (Linking Manifesto app)."

[lib]
name = "ubilink_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RT-4: persistent bidirectional link graph. `bundled` compiles SQLite from
# source so there is no system-libsqlite dependency (cross-platform, B4).
rusqlite = { version = "0.32", features = ["bundled"] }
# S3/RT-10: asymmetric signatures for integration bundles (publishers sign,
# app verifies with the publisher's public key — the model for an open registry).
ed25519-dalek = "2"
# Universally-unique stable ids for resources (RT-1 alias used by export/import).
# v4 = random; getrandom is already in the tree via ed25519-dalek. Not a network dep.
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"
